<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aaradhna Owner Report</title>
    <link rel="stylesheet" href="owner.css">
  </head>
  <body>
    <main class="owner">
      <header class="owner-header">
        <div class="brand">
          <img src="assets/aaradhna-logo.png" alt="Aaradhna Ice Dish & Gola logo">
          <div>
            <p>Aaradhna Ice Dish & Gola</p>
            <h1>Owner Report</h1>
          </div>
        </div>
        <nav>
          <a href="/">Billing</a>
          <a href="menu.html">Menu Edit</a>
          <a href="prep.html">Prep</a>
        </nav>
      </header>

      <section class="metrics" id="metrics"></section>

      <section class="qr-settings-section">
        <article class="qr-settings-card">
          <h2>QR Code Settings</h2>
          <div class="qr-preview">
            <p>Current QR Code:</p>
            <img id="qrPreview" alt="QR Preview" style="width: 200px; height: 200px; border: 1px solid #ddd;">
          </div>
          <div class="qr-controls">
            <div class="form-group">
              <label for="qrLabel">QR Label:</label>
              <input type="text" id="qrLabel" placeholder="e.g., Scan For UPI Payment" value="Scan For UPI Payment">
            </div>
            <div class="form-group">
              <label for="upiText">UPI Payment Text:</label>
              <input type="text" id="upiText" placeholder="e.g., upi://pay?pa=...">
            </div>
            <div class="form-group">
              <label for="qrImageUpload">Or Upload QR Image:</label>
              <input type="file" id="qrImageUpload" accept="image/*">
              <small>Upload a custom QR code image (PNG, JPG)</small>
            </div>
            <button id="saveQrBtn" class="save-btn">Save QR Settings</button>
            <button id="resetQrBtn" class="reset-btn">Reset to Default</button>
          </div>
        </article>
      </section>

      <section class="tables">
        <article>
          <h2>Item Sales</h2>
          <div id="itemSales"></div>
        </article>
        <article>
          <h2>Payment Summary</h2>
          <div id="paymentSales"></div>
        </article>
        <article>
          <h2>Customer List</h2>
          <div id="customerList"></div>
        </article>
        <article>
          <h2>Cancelled Orders</h2>
          <div id="cancelledList"></div>
        </article>
      </section>
    </main>
    <script src="owner.js"></script>
  </body>
</html>
